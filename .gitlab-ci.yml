# 2-day showcase pipeline (GitLab.com + self-hosted Runner on DigitalOcean).
# Uses Docker socket (not DinD) to save RAM on a 4GB droplet.

stages:
  - validate
  - build
  - deploy
  - verify

variables:
  APP_NAME: voice-ai
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  DEPLOY_PATH: /opt/voice_ai
  # Socket mount is configured on the runner (see gitlab/2DAY-DEMO.md)

# ── Validate ────────────────────────────────────────────────────────────────
lint:
  stage: validate
  image: node:22-alpine
  script:
    - npm ci --omit=dev
    - node --check server.js
    - node --check api.js
    - node --check store.js
    - node --check campaign.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Build & push (runner must mount docker.sock) ────────────────────────────
build:
  stage: build
  image: docker:27
  # No docker:dind service — lower memory for 2-day demo
  before_script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Same-droplet deploy (simplest for 2-day showcase) ───────────────────────
# Runner and app share the host Docker daemon via socket.
deploy_local:
  stage: deploy
  image: docker:27
  needs: ["build"]
  script:
    - docker pull "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$APP_NAME:current"
    - |
      if [ -f "$DEPLOY_PATH/docker-compose.prod.yml" ]; then
        cd "$DEPLOY_PATH"
        docker compose -f docker-compose.prod.yml up -d --force-recreate app
      else
        docker rm -f "$APP_NAME" 2>/dev/null || true
        docker run -d --name "$APP_NAME" --restart unless-stopped \
          --env-file "$DEPLOY_PATH/.env" \
          -p 3006:3006 \
          -v "$DEPLOY_PATH/data:/app/data" \
          "$APP_NAME:current"
      fi
    - docker image prune -f
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEMO_SAME_DROPLET == "1"
      when: manual

# ── SSH deploy (use if app is on another host) ──────────────────────────────
# CI variables: SSH_PRIVATE_KEY, DROPLET_HOST, DROPLET_USER
deploy_ssh:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DROPLET_USER@$DROPLET_HOST" "bash -s" <<EOF
        set -euo pipefail
        cd $DEPLOY_PATH
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker pull $IMAGE_TAG
        docker tag $IMAGE_TAG $APP_NAME:current
        docker compose -f docker-compose.prod.yml up -d --force-recreate app
        docker image prune -f
      EOF
  environment:
    name: production
    url: https://$DROPLET_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEMO_SAME_DROPLET != "1"
      when: manual

# ── Optional smoke check ────────────────────────────────────────────────────
verify:
  stage: verify
  image: curlimages/curl:8.10.1
  needs:
    - job: deploy_local
      optional: true
    - job: deploy_ssh
      optional: true
  script:
    - |
      TARGET="${HEALTH_URL:-http://127.0.0.1:3006/health}"
      if [ -n "${DROPLET_HOST:-}" ]; then
        TARGET="https://${DROPLET_HOST}/health"
      fi
      for i in 1 2 3 4 5; do
        if curl -fsS "$TARGET" >/dev/null; then
          echo "Health check OK ($TARGET)"
          exit 0
        fi
        echo "Waiting... ($i) $TARGET"
        sleep 5
      done
      echo "Health check failed (ok to ignore for local-only demo)" >&2
      exit 1
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
