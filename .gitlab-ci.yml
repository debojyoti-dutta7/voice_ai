stages:
  - test
  - build
  - scan
  - deploy
  - smoke

variables:
  APP_NAME: voice-ai
  DEPLOY_PATH: /opt/voice_ai
  IMAGE: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO

# basic syntax check — we don't have a real unit test suite yet
syntax:
  stage: test
  image: node:22-alpine
  script:
    - npm ci --omit=dev
    - node --check server.js
    - node --check api.js
    - node --check store.js
    - node --check campaign.js
  rules:
    - if: $CI_COMMIT_BRANCH == "demo"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# build image and push to AWS ECR
# CI vars needed: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_DEFAULT_REGION, AWS_ACCOUNT_ID, ECR_REPO
build:
  stage: build
  image: docker:27
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "demo"

# trivy scan — critical only, allow_failure so noisy CVEs don't block the demo
trivy:
  stage: scan
  image: docker:27
  needs: ["build"]
  before_script:
    - apk add --no-cache curl aws-cli
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker pull $IMAGE:$CI_COMMIT_SHORT_SHA
    - trivy image --exit-code 1 --severity CRITICAL --no-progress $IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "demo"

# ssh into the droplet and pull the new image
# CI vars: SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER
# server must already be able to pull from ECR (aws cli + creds on the box)
deploy:
  stage: deploy
  image: alpine:3.20
  needs: ["build"]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        set -e
        cd $DEPLOY_PATH
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        docker pull $IMAGE:$CI_COMMIT_SHORT_SHA
        docker tag $IMAGE:$CI_COMMIT_SHORT_SHA $APP_NAME:current
        docker compose -f docker-compose.prod.yml up -d --force-recreate app
        docker image prune -f
      "
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "demo"

# hit /health a couple times after deploy
smoke:
  stage: smoke
  image: curlimages/curl:8.10.1
  needs: ["deploy"]
  script:
    - |
      url=${HEALTH_URL:-https://$DEPLOY_HOST/health}
      for i in 1 2 3 4 5; do
        curl -fsS $url && exit 0
        echo waiting $i
        sleep 5
      done
      exit 1
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "demo"
